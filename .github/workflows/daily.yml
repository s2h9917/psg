name: daily-pick

on:
  schedule:
    # ⚠️ GitHub 예약은 UTC 기준이며 정시(:00)엔 지연이 큽니다. 정시를 피해 설정했습니다.
    - cron: '30 23 * * *'    # 08:30 KST(전일 23:30 UTC) → 시초가(open)
    - cron: '5 6 * * *'      # 15:05 KST(당일 06:05 UTC) → 종가(close)
  workflow_dispatch:
    inputs:
      session:
        description: '세션 선택 (open=시초가 / close=종가)'
        default: 'close'
        type: choice
        options: [open, close]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Generate & send picks
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARKETS: 'KOSPI,KOSDAQ'
          PER_MARKET: '3'
          # 오전 스케줄(23:30 UTC)=시초가, 그 외=종가. 수동 실행 시 입력값 우선.
          SESSION: ${{ github.event.inputs.session || (github.event.schedule == '30 23 * * *' && 'open' || 'close') }}
        run: python notify.py
      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recommendation_history.csv || true
          git commit -m "auto: ${SESSION:-picks} $(date +%F)" || echo "no changes"
          git push || echo "push skipped"
